           }</script><script>document.addEventListener("DOMContentLoaded", function () {
   
       var passwordInput = document.getElementById("dmdh-sub-password");
       var unlockButton = document.getElementById("dmdh-sub-unlock-button");
       var lockBox = document.getElementById("dmdh-sub-lock");
       var contentBox = document.getElementById("dmdh-sub-content");
       var errorBox = document.getElementById("dmdh-sub-error");
   
       function unlockSubscriptions() {
   
           if (passwordInput.value === "DDDmDDDh") {
   
               lockBox.style.display = "none";
               contentBox.style.display = "block";
               errorBox.style.display = "none";
   
           } else {
   
               errorBox.style.display = "block";
   
           }
       }
   
   
       /* 鼠标点击解锁 */
       if (unlockButton) {
   
           unlockButton.addEventListener("click", function () {
               unlockSubscriptions();
           });
   
       }
   
   
       /* Enter 键解锁 */
       if (passwordInput) {
   
           passwordInput.addEventListener("keydown", function (event) {
   
               if (event.key === "Enter") {
                   unlockSubscriptions();
               }
   
           });
   
       }
   
   
       /* Copy */
       var copyButtons = document.querySelectorAll(".dmdh-copy-button");
   
       copyButtons.forEach(function (button) {
   
           button.addEventListener("click", function () {
   
               var item = button.closest(".dmdh-sub-item");
   
               if (!item) {
                   return;
               }
   
               var text = item.getAttribute("data-sub");
   
               if (!text) {
                   return;
               }
   
   
               /* 优先使用现代 Clipboard API */
               if (navigator.clipboard && window.isSecureContext) {
   
                   navigator.clipboard.writeText(text).then(function () {
   
                       button.innerText = "Copied!";
   
                       setTimeout(function () {
                           button.innerText = "Copy";
                       }, 1500);
   
                   }).catch(function () {
   
                       fallbackCopy(text, button);
   
                   });
   
               } else {
   
                   fallbackCopy(text, button);
   
               }
   
           });
   
       });
   
   
       /* 兼容旧浏览器的复制方法 */
       function fallbackCopy(text, button) {
   
           var textarea = document.createElement("textarea");
   
           textarea.value = text;
   
           textarea.style.position = "fixed";
           textarea.style.left = "-9999px";
           textarea.style.top = "0";
           textarea.style.opacity = "0";
   
           document.body.appendChild(textarea);
   
           textarea.focus();
           textarea.select();
   
           try {
   
               document.execCommand("copy");
   
               button.innerText = "Copied!";
   
           } catch (error) {
   
               button.innerText = "Failed";
   
           }
   
           document.body.removeChild(textarea);
   
           setTimeout(function () {
   
               button.innerText = "Copy";
   
           }, 1500);
   
       }
   
   });</script></body></html>
